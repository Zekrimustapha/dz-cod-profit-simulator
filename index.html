<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DZ COD Profit Simulator</title>
<meta name="description" content="Check a Cash-on-Delivery product for Algeria before you spend on ads: profit, break-even CPO, delivery-rate risk, cash flow and test plan.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M5 16l4-4 3 3 6-7' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Shell: dark sidebar nav · sticky top bar · live result strip · inputs column + results. Tablet/phone: drawer nav, bottom-sheet inputs, scrollable section chips. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef2f8; --surface-3:#e4e9f2; --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b; --line:#e2e8f0;
  --brand:#4f46e5; --brand-2:#6366f1; --brand-ink:#ffffff; --brand-soft:#eef2ff;
  --good:#047857; --warn:#b45309; --bad:#dc2626; --good-bg:#ecfdf5; --warn-bg:#fffbeb; --bad-bg:#fef2f2;
  --s1:#6366f1; --s2:#f59e0b; --s3:#06b6d4; --s4:#8b5cf6; --s5:#ec4899; --s6:#10b981;
  --side:#0f172a; --side-2:#1e293b; --side-ink:#cbd5e1; --side-ink-2:#94a3b8;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05); --shadow-lg:0 12px 40px rgba(15,23,42,.18);
  --r:14px; --r-sm:10px;
  --f-body:"Fira Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Fira Code",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#111a2e; --surface-2:#172238; --surface-3:#1f2c46; --ink:#e2e8f0; --ink-2:#a9b4c8; --ink-3:#8a97ad; --line:#24314b;
  --brand:#818cf8; --brand-2:#a5b4fc; --brand-ink:#0b1120; --brand-soft:#1e2448;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --good-bg:#0f2a24; --warn-bg:#2b2310; --bad-bg:#2d1518;
  --s1:#818cf8; --s2:#fbbf24; --s3:#22d3ee; --s4:#a78bfa; --s5:#f472b6; --s6:#34d399;
  --side:#070b16; --side-2:#141c30; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#172238; --surface-3:#1f2c46; --ink:#e2e8f0; --ink-2:#a9b4c8; --ink-3:#8a97ad; --line:#24314b;
  --brand:#818cf8; --brand-2:#a5b4fc; --brand-ink:#0b1120; --brand-soft:#1e2448;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --good-bg:#0f2a24; --warn-bg:#2b2310; --bad-bg:#2d1518;
  --s1:#818cf8; --s2:#fbbf24; --s3:#22d3ee; --s4:#a78bfa; --s5:#f472b6; --s6:#34d399;
  --side:#070b16; --side-2:#141c30; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px}
.skip:focus{top:12px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px 14px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#10b981);box-shadow:0 6px 18px rgba(99,102,241,.35)}
.logo svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bt b{display:block;color:#fff;font-size:16px;letter-spacing:.02em}
.bt small{display:block;color:var(--side-ink-2);font-size:12px;line-height:1.3}
#nav{display:flex;flex-direction:column;gap:14px;flex:1}
.nh{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--side-ink-2);padding:0 10px 6px}
.ni{display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--side-ink);text-align:start;font-weight:500;font-size:14px;transition:background .18s var(--ease),color .18s var(--ease)}
.ni:hover{background:var(--side-2);color:#fff}
.ni[aria-current="page"]{background:linear-gradient(90deg,rgba(99,102,241,.95),rgba(99,102,241,.75));color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.35)}
[dir="rtl"] .ni[aria-current="page"]{background:linear-gradient(270deg,rgba(99,102,241,.95),rgba(99,102,241,.75))}
.ni svg.i{width:19px;height:19px;opacity:.95}
.sfoot{color:var(--side-ink-2);font-size:12px;padding:12px 10px 0;border-top:1px solid var(--side-2);margin-top:14px}
.main{min-width:0;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:8px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow);transition:transform .15s var(--ease),border-color .15s,color .15s}
.ibtn:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.ibtn:active{transform:scale(.96)}
.ibtn .lbl{font-weight:600;font-size:14px}
.lang{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:12px;border:1px solid var(--line)}
.lang button{border:0;background:transparent;color:var(--ink-2);min-width:40px;height:36px;padding:0 10px;border-radius:9px;font-weight:600;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.only-mob,.only-tab,.only-sheet{display:none}

/* ---------- live strip ---------- */
.live{position:sticky;top:71px;z-index:20;display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap;margin:14px max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));padding:10px 16px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-inline-start:5px solid var(--ink-3)}
.live.GO{border-inline-start-color:var(--good)} .live.TEST{border-inline-start-color:var(--warn)} .live.SKIP{border-inline-start-color:var(--bad)}
.vpill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.04em}
.vpill .d{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.vpill.GO{color:var(--good);background:var(--good-bg)} .vpill.TEST{color:var(--warn);background:var(--warn-bg)} .vpill.SKIP{color:var(--bad);background:var(--bad-bg)}
.lv{display:flex;flex-direction:column;min-width:0}
.lv .l{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.lv .v{font-size:16px;font-weight:600;white-space:nowrap}
.v.neg,.lv .v.neg{color:var(--bad)}
.lname{margin-inline-start:auto;color:var(--ink-3);font-size:13px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- work area ---------- */
.work{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start;padding:16px max(20px,env(safe-area-inset-right)) 56px max(20px,env(safe-area-inset-left))}
#view{min-width:0;outline:none;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- inputs ---------- */
.inputs{position:sticky;top:150px;max-height:calc(100vh - 166px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:0 14px 14px;scrollbar-width:thin}
.ihead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:var(--surface);padding:14px 2px 10px;border-bottom:1px solid var(--line);margin:0 -2px 10px}
.ihead b{font-size:15px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-inline-start:8px;vertical-align:middle;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.presets{margin-bottom:10px}.presets .row{gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.presets .pill{flex:none}
.plab{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.pill{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:0 10px;min-height:36px;font-size:12.5px;font-weight:500;transition:all .15s var(--ease)}
.pill:hover{border-color:var(--brand);color:var(--brand)}
.pill[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.grp{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;background:var(--surface)}
.grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px;border-radius:var(--r-sm)}
.grp summary::-webkit-details-marker{display:none}
.grp summary:hover{background:var(--surface-2)}
.grp .gi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.grp .gi svg{width:17px;height:17px}
.grp svg.chev{margin-inline-start:auto;width:18px;height:18px;color:var(--ink-3);transition:transform .2s var(--ease)}
.grp[open] svg.chev{transform:rotate(180deg)}
.gb{padding:2px 12px 8px}
.f{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.gb .f:first-child{border-top:0}
.f label{color:var(--ink-2);font-size:13px;line-height:1.35}
.f small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.3;margin-top:2px}
.ib{position:relative;display:flex;align-items:center}
.ib .u{position:absolute;inset-inline-start:10px;font-size:12px;color:var(--ink-3);font-weight:600;pointer-events:none}
.ib.txt{grid-column:1/-1}
.f:has(.ib.txt){grid-template-columns:1fr}
input[type=number],input[type=text],textarea,select{width:100%;min-height:40px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:end;direction:ltr;transition:border-color .15s,box-shadow .15s,background .15s}
.ib input[type=number]{padding-inline-start:34px}
[dir="rtl"] .ib input[type=number]{padding-inline-start:10px;padding-inline-end:34px}
[dir="rtl"] .ib .u{inset-inline-start:auto;inset-inline-end:10px}
input[type=text]{text-align:start;font-family:var(--f-body)}
textarea{text-align:start;font-size:12.5px;min-height:96px}
input:hover,textarea:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
input:focus,textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.rg{grid-column:1/-1;-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:2px 0 0;direction:ltr}
.rg::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--brand) 0,var(--brand-2) var(--p,50%),var(--surface-3) var(--p,50%))}
.rg::-moz-range-track{height:6px;border-radius:99px;background:var(--surface-3)}
.rg::-moz-range-progress{height:6px;border-radius:99px;background:var(--brand)}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--surface);border:3px solid var(--brand);box-shadow:0 2px 6px rgba(15,23,42,.25)}
.rg::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.hint{color:var(--brand);background:none;border:0;padding:0;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:8px 16px;font-weight:600;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 30%,transparent);transition:transform .15s var(--ease),filter .15s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn.sec{background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn.wide{width:100%;margin-top:4px}
.btn svg.i{width:17px;height:17px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- results ---------- */
.verdict{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;align-items:center;padding:20px 22px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px}
.verdict::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 140% at 0% 0%,var(--vbg,transparent),transparent 60%)}
[dir="rtl"] .verdict::before{background:radial-gradient(120% 140% at 100% 0%,var(--vbg,transparent),transparent 60%)}
.verdict>*{position:relative}
.verdict.GO{--vc:var(--good);--vbg:color-mix(in srgb,var(--good) 16%,transparent)} .verdict.TEST{--vc:var(--warn);--vbg:color-mix(in srgb,var(--warn) 16%,transparent)} .verdict.SKIP{--vc:var(--bad);--vbg:color-mix(in srgb,var(--bad) 16%,transparent)}
.vtag{font-weight:800;font-size:26px;letter-spacing:.03em;color:var(--vc);padding:8px 16px;border-radius:12px;background:color-mix(in srgb,var(--vc) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--vc) 35%,transparent)}
.vtxt{color:var(--ink-2);font-size:15px}
.meter{grid-column:1/-1;margin-top:10px}
.mbar{position:relative;height:10px;border-radius:99px;background:var(--surface-3);overflow:visible}
.mbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn) 50%,var(--good));background-size:200% 100%;background-position:0 0}
.verdict.GO .mbar i{background:linear-gradient(90deg,color-mix(in srgb,var(--good) 55%,transparent),var(--good))}
.verdict.TEST .mbar i{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 55%,transparent),var(--warn))}
.verdict.SKIP .mbar i{background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 55%,transparent),var(--bad))}
.mbar u{position:absolute;top:-4px;bottom:-4px;inset-inline-start:50%;width:2px;background:var(--ink);border-radius:2px;text-decoration:none}
.mlab{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.mlab b{color:var(--ink)}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.chip::before{font-weight:800}
.chip.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent)} .chip.good::before{content:"\2713";color:var(--good)}
.chip.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .chip.warn::before{content:"!";color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)} .chip.bad::before{content:"\00d7";color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px;min-width:0;box-shadow:var(--shadow);transition:transform .18s var(--ease),box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi::after{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--c,var(--brand))}
.kpi svg.ki{width:34px;height:34px;padding:7px;border-radius:10px;color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 13%,transparent);margin-bottom:8px}
.kpi .l{color:var(--ink-3);font-size:12.5px;font-weight:500}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.kpi .n{color:var(--ink-3);font-size:12px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(var(--brand),var(--s6))}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.two>.card{margin-bottom:0}
.be{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.be>div{min-width:0;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.be .l{color:var(--ink-3);font-size:12.5px} .be .v{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums} .be .n{font-size:12px;color:var(--ink-2)}
.stack{display:flex;height:42px;border-radius:12px;overflow:hidden;background:var(--surface-3);gap:3px;padding:3px}
.stack i{display:block;height:100%;min-width:3px;border-radius:8px}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;margin-top:16px;font-size:13.5px}
.legend .sw{width:12px;height:12px;border-radius:4px}
.legend .pc{color:var(--ink-3);font-family:var(--f-mono);font-size:12px;min-width:48px;text-align:end}
.legend .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end;direction:ltr;unicode-bidi:isolate}
.fun{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:10px 12px;align-items:center;font-size:13.5px}
.fun .bar{height:26px;background:var(--surface-3);border-radius:8px;overflow:hidden}

.tw{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover td{background:var(--brand-soft)}
tbody tr:last-child td{border-bottom:0}
td.val,th.val{text-align:end}
tr.best td{background:color-mix(in srgb,var(--good) 14%,var(--surface))!important;font-weight:600}
.heat{border-collapse:separate;border-spacing:4px}
.heat td{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;border:0;border-radius:8px;padding:10px 6px;font-weight:600}
.heat td.cur{outline:3px solid var(--brand);outline-offset:-3px}
.heat th{text-align:center;background:none;border:0}
.heat tbody tr:nth-child(even) td{background:inherit}
.note{color:var(--ink-3);font-size:12.5px;margin:12px 0 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:7px}
.dot.GO{background:var(--good)} .dot.TEST{background:var(--warn)} .dot.SKIP{background:var(--bad)}
.toast{position:fixed;z-index:90;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-lg)}
.big{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--brand),var(--s6));-webkit-background-clip:text;background-clip:text;color:transparent}
.hist{position:relative;display:flex;align-items:flex-end;gap:2px;height:170px;border-bottom:1px solid var(--line)}
.hist i{flex:1;display:block;min-height:1px;border-radius:3px 3px 0 0}
.hist u{position:absolute;top:0;bottom:0;width:0;border-inline-start:2px dashed var(--ink);text-decoration:none}
.axis{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11px;font-family:var(--f-mono);margin-top:4px}
.fab{position:fixed;z-index:35;inset-inline-end:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom,0px));align-items:center;gap:8px;min-height:52px;padding:0 20px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--brand),#7c3aed);color:#fff;font-weight:600;box-shadow:0 10px 30px rgba(79,70,229,.45)}
.fab svg.i{width:20px;height:20px}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(2,6,23,.5);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.mtabs{display:none}

/* ---------- tablet: 2 columns, inputs as sheet ---------- */
@media (max-width:1180px){
  .work{grid-template-columns:minmax(0,1fr)}
  .only-tab{display:inline-flex}
  .inputs{position:fixed;z-index:50;inset-inline:0;bottom:0;top:auto;max-height:82vh;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s var(--ease);box-shadow:var(--shadow-lg);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
  .only-sheet{display:inline-flex}
  body.inputs-open .inputs{transform:none}
  body.inputs-open .scrim,body.nav-open .scrim{opacity:1;pointer-events:auto}
  body.inputs-open .fab{display:none}
  .ihead::before{content:"";position:absolute;top:6px;inset-inline:0;margin:auto;width:42px;height:4px;border-radius:4px;background:var(--line)}
}
/* ---------- phone/small tablet: drawer nav + chips ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:280px;max-width:85vw;transform:translateX(-105%);transition:transform .3s var(--ease);box-shadow:var(--shadow-lg);z-index:60}
  [dir="rtl"] .side{transform:translateX(105%)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .only-mob{display:inline-flex}
  #btnInputs{display:none}
  .topbar{padding-top:10px;padding-bottom:10px}
  h1{font-size:18px}
  .mtabs{display:flex;gap:8px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-right)) 2px max(16px,env(safe-area-inset-left));scrollbar-width:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mt{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:500}
  .mt svg.i{width:16px;height:16px}
  .mt[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .live{position:static;margin-inline:16px;gap:8px 16px}
  .lname{display:none}
  .work{padding-inline:16px;padding-bottom:96px}
  .inputs{max-width:none}
}
@media (max-width:560px){
  .hide-xs,#btnShare{display:none!important}
  .ibtn .lbl{display:none}
  .sub{display:none}
  .live{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .live .vpill{grid-column:1/-1;justify-self:start}
  .verdict{grid-template-columns:1fr;padding:16px}
  .vtag{justify-self:start;font-size:22px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:17px}
  .f{grid-template-columns:minmax(0,1fr) 116px}
  .fun{grid-template-columns:92px minmax(0,1fr) 56px}
  .legend{grid-template-columns:auto minmax(0,1fr) auto}
  .legend .pc{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .lang button{min-width:34px;padding:0 8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
//MODEL_START
// All money in DZD unless noted. Rates are fractions (0.65 = 65%).
function model(p){
  var u = p.units || 1, uc = (p.cost + p.pack) * u;
  var D = p.target, C = D / p.dr, L = C / p.cr, R = C - D;
  var ads = L * p.cpo * p.rate, cc = C * p.cc + D * (p.ccd || 0), cogs = D * uc, lost = R * p.dmg * uc;
  var ret = R * p.ret, cour = D * p.courier, cod = D * p.price * p.cod, tax = D * p.price * (p.tax || 0);
  var rev = D * p.price, costs = ads + cc + cogs + lost + ret + cour + cod + tax, net = rev - costs;
  var maxAds = net + ads;
  return {u:u, uc:uc, D:D, C:C, L:L, R:R, ads:ads, cc:cc, cogs:cogs, lost:lost, ret:ret, cour:cour, cod:cod, tax:tax,
    rev:rev, costs:costs, net:net, perOrder: net / D, roi: costs > 0 ? net / costs : 0, margin: rev > 0 ? net / rev : 0,
    roas: ads > 0 ? rev / ads : 0, maxAds: maxAds, beRoas: maxAds > 0 ? rev / maxAds : Infinity,
    maxCpo: maxAds / (L * p.rate), capital: ads + cc + C * uc, netPerLead: net / L};
}
function solveRate(p, key){ // break-even confirmation or delivery rate (null = unreachable)
  function netAt(x){ var q = Object.assign({}, p); q[key] = x; return model(q).net; }
  if (netAt(1) < 0) return null;
  if (netAt(0.01) >= 0) return 0.01;
  var lo = 0.01, hi = 1;
  for (var i = 0; i < 60; i++){ var m = (lo + hi) / 2; if (netAt(m) >= 0) hi = m; else lo = m; }
  return hi;
}
function clamp(x, a, b){ return Math.min(b, Math.max(a, x)); }
function scenario(p, name){
  var q = Object.assign({}, p);
  if (name === 'pess'){ q.cr = clamp(p.cr - 0.10, 0.05, 1); q.dr = clamp(p.dr - 0.10, 0.05, 1); q.cpo = p.cpo * 1.3; }
  if (name === 'opt'){ q.cr = clamp(p.cr + 0.05, 0.05, 1); q.dr = clamp(p.dr + 0.05, 0.05, 1); q.cpo = p.cpo * 0.85; }
  return q;
}
function landed(l, rate){
  var goods = l.cny * l.cnyusd, agent = goods * l.agent / 100, freight = l.kg * l.fr, duty = (goods + freight) * l.duty / 100;
  var usd = goods + agent + freight + duty, fixed = (l.clear + l.local) / l.qty;
  return {goods: goods * rate, agent: agent * rate, freight: freight * rate, duty: duty * rate, fixed: fixed, total: usd * rate + fixed};
}
function verdict(p, m){
  var pess = model(scenario(p, 'pess'));
  var v = 'SKIP';
  if (m.perOrder >= p.minp && m.roi >= 0.4 && pess.net > 0) v = 'GO';
  else if (m.net > 0 && (m.perOrder >= p.minp * 0.5 || m.roi >= 0.2)) v = 'TEST';
  return {v: v, pess: pess};
}

function adFunnel(a, maxCpo){
  var cpc = a.cpm / (1000 * a.ctr / 100), cpo = cpc / (a.cvr / 100);
  return {cpc: cpc, cpo: cpo, visitors: 100 / a.cvr, needCvr: maxCpo > 0 ? cpc / maxCpo * 100 : null};
}
function zoneCalc(p, z){ // z: [[share,dr,ret] x3] with percentages
  var sh = 0, dw = 0, rn = 0, rd = 0, res = [];
  z.forEach(function(r){ var s = r[0], d = r[1] / 100; sh += s; dw += s * d; rn += s * (1 - d) * r[2]; rd += s * (1 - d);
    var q = Object.assign({}, p, {dr: clamp(d, 0.01, 1), ret: r[2]}); res.push(model(q)); });
  return {dr: sh > 0 ? dw / sh : 0, ret: rd > 0 ? rn / rd : 0, zones: res};
}
function priceLab(p, budget, e, drop){
  var out = [], best = 0;
  for (var i = 0; i <= 10; i++){ var f = 0.6 + i * 0.1, st = (f - 1) / 0.1 * drop / 100, q = Object.assign({}, p, {price: p.price * f, cpo: p.cpo * Math.pow(f, e), cr: clamp(p.cr - st, 0.05, 1), dr: clamp(p.dr - st / 2, 0.05, 1)});
    var m = model(q), dpd = budget / q.cpo * q.cr * q.dr; out.push({f: f, price: q.price, cpo: q.cpo, perOrder: m.perOrder, day: dpd * m.perOrder});
    if (out[i].day > out[best].day) best = i; }
  return {rows: out, best: best};
}
function cashFlow(p, o){ // o: budget, delay, stockDays, fixed ; 60 days
  var N = 60, cum = [], flow = new Array(N + o.delay + 2).fill(0), m1 = model(Object.assign({}, p, {target: 1}));
  var uc = (p.cost + p.pack), leads = o.budget / p.cpo, conf = leads * p.cr, del = conf * p.dr, ret = conf - del;
  var cogsDay = del * uc + ret * p.dmg * uc, net1 = p.price - p.courier - p.price * p.cod - p.price * (p.tax || 0);
  flow[0] -= cogsDay * o.stockDays;
  for (var d = 1; d <= N; d++){
    flow[d] -= o.budget * p.rate + conf * p.cc + del * (p.ccd || 0) + o.fixed / 30;
    if (d > o.stockDays) flow[d] -= cogsDay;
    var t = d + o.delay; flow[t] += del * net1 - ret * p.ret;
  }
  var c = 0, min = 0, minDay = 0;
  for (var k = 0; k <= N; k++){ c += flow[k]; cum.push(c); if (c < min){ min = c; minDay = k; } }
  var be = null; for (var j = minDay; j <= N; j++){ if (cum[j] >= 0){ be = j; break; } }
  if (min === 0) be = 0;
  return {cum: cum, peak: -min, be: be, end: cum[N], minDay: minDay};
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tri(r, a, m, b){ var u = r(), c = (m - a) / (b - a || 1); return u < c ? a + Math.sqrt(u * (b - a) * (m - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - m)); }
function monteCarlo(p, o, N){ // o: cr (pts), dr (pts), lo, hi
  var r = rng(20260101), vals = [], nets = [];
  for (var i = 0; i < N; i++){
    var q = Object.assign({}, p);
    q.cr = clamp(tri(r, p.cr - o.cr / 100, p.cr, p.cr + o.cr / 100 * 0.6), 0.05, 1);
    q.dr = clamp(tri(r, p.dr - o.dr / 100, p.dr, p.dr + o.dr / 100 * 0.6), 0.05, 1);
    q.cpo = tri(r, p.cpo * o.lo, p.cpo, p.cpo * o.hi);
    q.cost = tri(r, p.cost * 0.95, p.cost, p.cost * 1.15);
    var m = model(q); vals.push(m.perOrder); nets.push(m.net);
  }
  var s = vals.slice().sort(function(a, b){ return a - b; });
  function pct(x){ return s[Math.min(N - 1, Math.floor(x * N))]; }
  var mean = vals.reduce(function(a, b){ return a + b; }, 0) / N, nmean = nets.reduce(function(a, b){ return a + b; }, 0) / N;
  return {vals: vals, pProfit: vals.filter(function(v){ return v > 0; }).length / N, pMin: vals.filter(function(v){ return v >= p.minp; }).length / N,
    mean: mean, nmean: nmean, p5: pct(0.05), p10: pct(0.1), p50: pct(0.5), p90: pct(0.9), lo: pct(0.01), hi: pct(0.99)};
}
function monthly(p, budget, fixed, rep, repn, infl){
  var m = model(p), dpd = budget / p.cpo * p.cr * p.dr, k = dpd * 30 / m.D;
  var ro = model(Object.assign({}, p, {cpo: 0})).perOrder, extra = rep / 100 * repn * ro;
  var gross = m.net * k, repProfit = dpd * 30 * extra;
  var ladder = [20, 50, 100, 200, 500, 1000].map(function(b){ var q = Object.assign({}, p, {cpo: p.cpo * Math.pow(1 + infl / 100, Math.log(b / budget) / Math.LN2)});
    var mm = model(q), dd = b / q.cpo * q.cr * q.dr; return {b: b, cpo: q.cpo, profit: dd * mm.perOrder * 30}; });
  return {m: m, k: k, dpd: dpd, gross: gross, fixed: fixed, repProfit: repProfit, net: gross - fixed + repProfit,
    beOrders: m.perOrder > 0 ? fixed / m.perOrder : null, extra: extra, ltv: m.perOrder + extra,
    maxCpoLtv: (m.maxAds + extra * m.D) / (m.L * p.rate), ladder: ladder};
}
//MODEL_END

 var d=xs.map(function(x,i){return(i?"L":"M")+X(x).toFixed(1)+" "+Y(ys[i]).toFixed(1)}).join(" ");

 return'<div class="card"><h3>'+T("sc_t")+'</h3><div class="tw"><table><thead><tr><th></th><th class="val">'+T("sc_cr")+'</th><th class="val">'+T("sc_dr")+'</th><th class="val">'+T("sc_cpo")+'</th><th class="val">'+T("k_net")+'</th><th class="val">'+T("th_unit")+'</th><th class="val">ROI</th><th>'+T("th_v")+'</th></tr></thead><tbody>'+
 rows.map(function(r){return'<tr><td><b>'+T("sc_"+r.n)+'</b></td><td class="val">'+pc(r.q.cr)+'</td><td class="val">'+pc(r.q.dr)+'</td><td class="val">$'+nf(r.q.cpo,2)+'</td><td class="val">'+da(r.m.net)+'</td><td class="val">'+da(r.m.perOrder)+'</td><td class="val">'+pc(r.m.roi)+'</td><td><span class="dot '+r.v+'"></span>'+T(r.v)+'</td></tr>'}).join("")+'</tbody></table></div><p class="note">'+T("sc_d")+'</p></div>'}

 var mx=Math.max.apply(null,vals.map(Math.abs))||1;
 drs.forEach(function(d,i){h+='<tr><th>'+pc(d)+'</th>';fs.forEach(function(f,j){var v=vals[i*fs.length+j],a=Math.min(60,Math.abs(v)/mx*60+6);
  h+='<td class="'+(i===ci&&f===1?"cur":"")+'" style="background:color-mix(in srgb,var('+(v>=0?"--good":"--bad")+') '+a.toFixed(0)+'%,var(--surface))">'+nf(v)+'</td>'});h+='</tr>'});

 '</tbody></table></div><p class="note">'+T("bu_d")+'</p></div>'}
