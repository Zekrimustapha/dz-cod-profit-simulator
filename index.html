<script>
//MODEL_START
// All money in DZD unless noted. Rates are fractions (0.65 = 65%).
function model(p){
  var u = p.units || 1, uc = (p.cost + p.pack) * u;
  var D = p.target, C = D / p.dr, L = C / p.cr, R = C - D;
  var ads = L * p.cpo * p.rate, cc = C * p.cc, cogs = D * uc, lost = R * p.dmg * uc;
  var ret = R * p.ret, cour = D * p.courier, cod = D * p.price * p.cod, tax = D * p.price * (p.tax || 0);
  var rev = D * p.price, costs = ads + cc + cogs + lost + ret + cour + cod + tax, net = rev - costs;
  var maxAds = net + ads;
  return {u:u, uc:uc, D:D, C:C, L:L, R:R, ads:ads, cc:cc, cogs:cogs, lost:lost, ret:ret, cour:cour, cod:cod, tax:tax,
    rev:rev, costs:costs, net:net, perOrder: net / D, roi: costs > 0 ? net / costs : 0, margin: rev > 0 ? net / rev : 0,
    roas: ads > 0 ? rev / ads : 0, maxAds: maxAds, beRoas: maxAds > 0 ? rev / maxAds : Infinity,
    maxCpo: maxAds / (L * p.rate), capital: ads + cc + C * uc, netPerLead: net / L};
}
function solveRate(p, key){ // break-even confirmation or delivery rate (null = unreachable)
  function netAt(x){ var q = Object.assign({}, p); q[key] = x; return model(q).net; }
  if (netAt(1) < 0) return null;
  if (netAt(0.01) >= 0) return 0.01;
  var lo = 0.01, hi = 1;
  for (var i = 0; i < 60; i++){ var m = (lo + hi) / 2; if (netAt(m) >= 0) hi = m; else lo = m; }
  return hi;
}
function clamp(x, a, b){ return Math.min(b, Math.max(a, x)); }
function scenario(p, name){
  var q = Object.assign({}, p);
  if (name === 'pess'){ q.cr = clamp(p.cr - 0.10, 0.05, 1); q.dr = clamp(p.dr - 0.10, 0.05, 1); q.cpo = p.cpo * 1.3; }
  if (name === 'opt'){ q.cr = clamp(p.cr + 0.05, 0.05, 1); q.dr = clamp(p.dr + 0.05, 0.05, 1); q.cpo = p.cpo * 0.85; }
  return q;
}
function landed(l, rate){
  var goods = l.cny * l.cnyusd, agent = goods * l.agent / 100, freight = l.kg * l.fr, duty = (goods + freight) * l.duty / 100;
  var usd = goods + agent + freight + duty, fixed = (l.clear + l.local) / l.qty;
  return {goods: goods * rate, agent: agent * rate, freight: freight * rate, duty: duty * rate, fixed: fixed, total: usd * rate + fixed};
}
function verdict(p, m){
  var pess = model(scenario(p, 'pess'));
  var v = 'SKIP';
  if (m.perOrder >= p.minp && m.roi >= 0.4 && pess.net > 0) v = 'GO';
  else if (m.net > 0 && (m.perOrder >= p.minp * 0.5 || m.roi >= 0.2)) v = 'TEST';
  return {v: v, pess: pess};
}

function adFunnel(a, maxCpo){
  var cpc = a.cpm / (1000 * a.ctr / 100), cpo = cpc / (a.cvr / 100);
  return {cpc: cpc, cpo: cpo, visitors: 100 / a.cvr, needCvr: maxCpo > 0 ? cpc / maxCpo * 100 : null};
}
function zoneCalc(p, z){ // z: [[share,dr,ret] x3] with percentages
  var sh = 0, dw = 0, rn = 0, rd = 0, res = [];
  z.forEach(function(r){ var s = r[0], d = r[1] / 100; sh += s; dw += s * d; rn += s * (1 - d) * r[2]; rd += s * (1 - d);
    var q = Object.assign({}, p, {dr: clamp(d, 0.01, 1), ret: r[2]}); res.push(model(q)); });
  return {dr: sh > 0 ? dw / sh : 0, ret: rd > 0 ? rn / rd : 0, zones: res};
}
function priceLab(p, budget, e, drop){
  var out = [], best = 0;
  for (var i = 0; i <= 10; i++){ var f = 0.6 + i * 0.1, st = (f - 1) / 0.1 * drop / 100, q = Object.assign({}, p, {price: p.price * f, cpo: p.cpo * Math.pow(f, e), cr: clamp(p.cr - st, 0.05, 1), dr: clamp(p.dr - st / 2, 0.05, 1)});
    var m = model(q), dpd = budget / q.cpo * q.cr * q.dr; out.push({f: f, price: q.price, cpo: q.cpo, perOrder: m.perOrder, day: dpd * m.perOrder});
    if (out[i].day > out[best].day) best = i; }
  return {rows: out, best: best};
}
function cashFlow(p, o){ // o: budget, delay, stockDays, fixed ; 60 days
  var N = 60, cum = [], flow = new Array(N + o.delay + 2).fill(0), m1 = model(Object.assign({}, p, {target: 1}));
  var uc = (p.cost + p.pack), leads = o.budget / p.cpo, conf = leads * p.cr, del = conf * p.dr, ret = conf - del;
  var cogsDay = del * uc + ret * p.dmg * uc, net1 = p.price - p.courier - p.price * p.cod - p.price * (p.tax || 0);
  flow[0] -= cogsDay * o.stockDays;
  for (var d = 1; d <= N; d++){
    flow[d] -= o.budget * p.rate + conf * p.cc + o.fixed / 30;
    if (d > o.stockDays) flow[d] -= cogsDay;
    var t = d + o.delay; flow[t] += del * net1 - ret * p.ret;
  }
  var c = 0, min = 0, minDay = 0;
  for (var k = 0; k <= N; k++){ c += flow[k]; cum.push(c); if (c < min){ min = c; minDay = k; } }
  var be = null; for (var j = minDay; j <= N; j++){ if (cum[j] >= 0){ be = j; break; } }
  if (min === 0) be = 0;
  return {cum: cum, peak: -min, be: be, end: cum[N], minDay: minDay};
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tri(r, a, m, b){ var u = r(), c = (m - a) / (b - a || 1); return u < c ? a + Math.sqrt(u * (b - a) * (m - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - m)); }
function monteCarlo(p, o, N){ // o: cr (pts), dr (pts), lo, hi
  var r = rng(20260101), vals = [], nets = [];
  for (var i = 0; i < N; i++){
    var q = Object.assign({}, p);
    q.cr = clamp(tri(r, p.cr - o.cr / 100, p.cr, p.cr + o.cr / 100 * 0.6), 0.05, 1);
    q.dr = clamp(tri(r, p.dr - o.dr / 100, p.dr, p.dr + o.dr / 100 * 0.6), 0.05, 1);
    q.cpo = tri(r, p.cpo * o.lo, p.cpo, p.cpo * o.hi);
    q.cost = tri(r, p.cost * 0.95, p.cost, p.cost * 1.15);
    var m = model(q); vals.push(m.perOrder); nets.push(m.net);
  }
  var s = vals.slice().sort(function(a, b){ return a - b; });
  function pct(x){ return s[Math.min(N - 1, Math.floor(x * N))]; }
  var mean = vals.reduce(function(a, b){ return a + b; }, 0) / N, nmean = nets.reduce(function(a, b){ return a + b; }, 0) / N;
  return {vals: vals, pProfit: vals.filter(function(v){ return v > 0; }).length / N, pMin: vals.filter(function(v){ return v >= p.minp; }).length / N,
    mean: mean, nmean: nmean, p5: pct(0.05), p10: pct(0.1), p50: pct(0.5), p90: pct(0.9), lo: pct(0.01), hi: pct(0.99)};
}
function monthly(p, budget, fixed, rep, repn, infl){
  var m = model(p), dpd = budget / p.cpo * p.cr * p.dr, k = dpd * 30 / m.D;
  var ro = model(Object.assign({}, p, {cpo: 0})).perOrder, extra = rep / 100 * repn * ro;
  var gross = m.net * k, repProfit = dpd * 30 * extra;
  var ladder = [20, 50, 100, 200, 500, 1000].map(function(b){ var q = Object.assign({}, p, {cpo: p.cpo * Math.pow(1 + infl / 100, Math.log(b / budget) / Math.LN2)});
    var mm = model(q), dd = b / q.cpo * q.cr * q.dr; return {b: b, cpo: q.cpo, profit: dd * mm.perOrder * 30}; });
  return {m: m, k: k, dpd: dpd, gross: gross, fixed: fixed, repProfit: repProfit, net: gross - fixed + repProfit,
    beOrders: m.perOrder > 0 ? fixed / m.perOrder : null, extra: extra, ltv: m.perOrder + extra,
    maxCpoLtv: (m.maxAds + extra * m.D) / (m.L * p.rate), ladder: ladder};
}
//MODEL_END

function P(s,l){s=s||S;return{price:+s.price,cost:+s.cost,pack:+s.pack,cc:+s.cc,courier:+s.courier,ret:+s.ret,cod:+s.cod/100,dmg:+s.dmg/100,tax:+s.tax/100,cpo:+s.cpo,rate:+s.rate,cr:clamp(+s.cr/100,0.01,1),dr:clamp(+s.dr/100,0.01,1),target:Math.max(1,+s.target),minp:+s.minp,units:1}}
var FIELDS=[["g_prod",[["name","text"],["price"],["cost","num","calc_land"],["pack"]]],
["g_ops",[["cc"],["courier","num",null,"courier_h"],["ret"],["cod"],["dmg"],["tax"]]],
["g_camp",[["cpo"],["rate"],["cr"],["dr"],["budget"]]],
["g_goal",[["target"],["minp"]]]];
function buildInputs(){var h="";FIELDS.forEach(function(g){h+='<h2 data-i="'+g[0]+'"></h2>';g[1].forEach(function(f){var id=f[0];
 h+='<div class="f"><label for="in_'+id+'"><span data-i="'+id+'"></span>'+(f[3]?'<small data-i="'+f[3]+'"></small>':'')+(f[2]?'<small><button class="hint" data-go="land" data-i="'+f[2]+'"></button></small>':'')+'</label>'+
 '<input id="in_'+id+'" type="'+(f[1]==="text"?"text":"number")+'" '+(f[1]==="text"?"":'inputmode="decimal" step="any" min="0"')+' value="'+S[id]+'"></div>'});});
 $("inputs").innerHTML=h;
 $("inputs").addEventListener("input",function(e){var id=e.target.id.replace("in_","");if(!(id in S))return;S[id]=e.target.type==="text"?e.target.value:(e.target.value===""?0:+e.target.value);persist();render();});
 $("inputs").addEventListener("click",function(e){var g=e.target.getAttribute("data-go");if(g){tab=g;render();}});}
function setInput(id,v){S[id]=v;var el=$("in_"+id);if(el)el.value=v;}
var TABS=["over","land","fun","zone","price","bund","scen","sens","risk","cash","month","test","save"];
var TAB_KEY={over:"t_over",land:"t_land",fun:"t_fun",zone:"t_zone",price:"t_price",bund:"t_bund",scen:"t_scen",sens:"t_sens",risk:"t_risk",cash:"t_cash",month:"t_month",test:"t_test",save:"t_save"};
function applyI18n(){document.querySelectorAll("[data-i]").forEach(function(n){n.textContent=T(n.getAttribute("data-i"))});
 document.documentElement.lang=lang;$("app").dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});
 $("tabs").innerHTML=TABS.map(function(t){return'<button role="tab" data-t="'+t+'" aria-selected="'+(t===tab)+'">'+T(TAB_KEY[t])+'</button>'}).join("");}
function toast(msg){var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},1800)}
function copy(text,ok){function done(){toast(ok||T("sv_done"))}
 function fb(){var ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
 try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}}
function reasons(p,m,vd){var r=[];
 if(m.net<=0)r.push(["bad",T("r_loss")]);else{var h=m.maxCpo/p.cpo-1;r.push([h<0.25?"warn":"good",h<0.25?T("r_tight",nf(h*100)):T("r_head",nf(h*100))]);}
 r.push([vd.pess.net>0?"good":"bad",vd.pess.net>0?T("r_pess"):T("r_pessb")]);
 if(p.dr<0.6)r.push(["warn",T("r_dr")]);
 var cr=(p.cost+p.pack)/p.price;if(cr>0.4)r.push(["warn",T("r_cost",nf(cr*100))]);
 if(m.perOrder<p.minp)r.push(["warn",T("r_minp")]);
 return r}
function seg(m){var ret=m.ret+m.lost,ship=m.cour+m.cod;return[["c_ads",m.ads,"--s1"],["c_prod",m.cogs,"--s2"],["c_cc",m.cc,"--s3"],["c_ret",ret,"--s5"],["c_ship",ship,"--s4"]]}
function vOver(){var p=P(),m=model(p),vd=verdict(p,m),rs=reasons(p,m,vd);
 var beDr=solveRate(p,"dr"),beCr=solveRate(p,"cr"),mc=mcRun();rs.push([mc.pProfit>=0.7?"good":"warn",T(mc.pProfit>=0.7?"r_risk":"r_risk_b",nf(mc.pProfit*100))]);
 var h='<div class="verdict '+vd.v+'"><div class="vtag">'+T(vd.v)+'</div><div class="vtxt">'+T("v_"+vd.v)+'</div><div class="chips">'+rs.map(function(x){return'<span class="chip '+x[0]+'">'+x[1]+'</span>'}).join("")+'</div></div>';
 h+='<div class="kpis"><div class="kpi"><div class="l">'+T("k_net")+'</div><div class="v'+(m.net<0?" neg":"")+'">'+da(m.net)+'</div><div class="n">'+T("k_from",nf(m.D))+'</div></div>'+
 '<div class="kpi"><div class="l">'+T("k_unit")+'</div><div class="v'+(m.perOrder<0?" neg":"")+'">'+da(m.perOrder)+'</div></div>'+
 '<div class="kpi"><div class="l">'+T("k_roi")+'</div><div class="v'+(m.roi<0?" neg":"")+'">'+pc(m.roi)+'</div><div class="n">'+T("k_margin")+' '+pc(m.margin)+'</div></div>'+
 '<div class="kpi"><div class="l">'+T("k_chance")+'</div><div class="v">'+pc(mc.pProfit)+'</div><div class="n">'+T("k_chance_n")+'</div></div><div class="kpi"><div class="l">'+T("k_cap")+'</div><div class="v">'+da(m.capital)+'</div><div class="n">'+T("k_cap_n")+'</div></div></div>';
 h+='<div class="card"><h3>'+T("be_t")+'</h3><div class="be">'+
 '<div><div class="l">'+T("be_cpo")+'</div><div class="v">'+(m.maxCpo>0?"$"+nf(m.maxCpo,2):"-")+'</div><div class="n">'+T("be_cpo_n","$"+nf(p.cpo,2))+'</div></div>'+
 '<div><div class="l">'+T("be_dr")+'</div><div class="v">'+(beDr===null?T("be_no"):pc(beDr))+'</div><div class="n">'+T("dr").split(" (")[0]+': '+pc(p.dr)+'</div></div>'+
 '<div><div class="l">'+T("be_cr")+'</div><div class="v">'+(beCr===null?T("be_no"):pc(beCr))+'</div><div class="n">'+T("cr").split(" (")[0]+': '+pc(p.cr)+'</div></div>'+
 '<div><div class="l">'+T("be_roas")+'</div><div class="v">'+(isFinite(m.beRoas)?nf(m.beRoas,2)+"x":"-")+'</div><div class="n">'+T("be_roas_n",nf(m.roas,2))+'</div></div></div></div>';
 var sg=seg(m),tot=Math.max(m.rev,m.costs),loss=m.net<0;
 var bar='<div class="stack" role="img" aria-label="'+T("cb_t")+'">'+sg.map(function(s){return'<i style="width:'+(s[1]/tot*100).toFixed(2)+'%;background:var('+s[2]+')"></i>'}).join("")+(loss?'':'<i style="width:'+(m.net/tot*100).toFixed(2)+'%;background:var(--s6)"></i>')+'</div>';
 var lg='<div class="legend">'+sg.map(function(s){return'<span class="sw" style="background:var('+s[2]+')"></span><span>'+T(s[0])+'</span><span class="val">'+da(s[1])+'</span><span class="pc">'+pc(s[1]/tot,1)+'</span>'}).join("")+
 '<span class="sw" style="background:'+(loss?'var(--bad)':'var(--s6)')+'"></span><span><b>'+(loss?T("c_loss"):T("c_profit"))+'</b></span><span class="val"><b>'+da(m.net)+'</b></span><span class="pc">'+pc(m.net/tot,1)+'</span>'+
 '<span></span><span class="tot">'+T("c_total")+'</span><span class="val tot">'+da(m.rev)+'</span><span class="tot"></span></div>';
 h+='<div class="card"><h3>'+T("cb_t")+'</h3>'+bar+lg+'</div>';
 var fmax=m.L;function fr(k,v,c){return'<span>'+T(k)+'</span><span class="bar"><i style="width:'+(v/fmax*100).toFixed(1)+'%;background:var('+c+')"></i></span><span class="val">'+nf(v)+'</span>'}
 var lpd=S.budget/p.cpo,dpd=lpd*p.cr*p.dr,ppd=dpd*m.perOrder;
 h+='<div class="two"><div class="card"><h3>'+T("fun_t")+'</h3><div class="fun">'+fr("f_leads",m.L,"--s1")+fr("f_conf",m.C,"--s3")+fr("f_del",m.D,"--s6")+fr("f_ret",m.R,"--s5")+'</div></div>'+
 '<div class="card"><h3>'+T("proj_t")+'</h3><div class="be" style="grid-template-columns:1fr 1fr"><div><div class="l">'+T("p_leads")+'</div><div class="v">'+nf(lpd,1)+'</div></div><div><div class="l">'+T("p_del")+'</div><div class="v">'+nf(dpd,1)+'</div></div>'+
 '<div><div class="l">'+T("p_day")+'</div><div class="v">'+da(ppd)+'</div></div><div><div class="l">'+T("p_month")+'</div><div class="v">'+da(ppd*30)+'</div></div></div></div></div>';
 return h}
function fld(key,k,step){var a=key.split("."),v=(a[0]==="S"?S:LD)[a[1]];return'<div class="f"><label for="x_'+a[0]+a[1]+'">'+T(k)+'</label><input id="x_'+a[0]+a[1]+'" data-k="'+key+'" type="number" inputmode="decimal" step="'+(step||"any")+'" min="0" value="'+v+'"></div>'}
function vLand(){var l=landed(LD,+S.rate),p=P(),ratio=l.total/p.price;
 var rows=[["ld_goods",l.goods],["ld_agentr",l.agent],["ld_freight",l.freight],["ld_duty_r",l.duty],["ld_fixed",l.fixed]];
 return'<div class="two"><div class="card"><h3>'+T("ld_t")+'</h3>'+fld("LD.cny","ld_cny")+fld("LD.qty","ld_qty")+fld("LD.kg","ld_kg")+fld("LD.cnyusd","ld_cnyusd")+fld("LD.fr","ld_fr")+fld("LD.agent","ld_agent")+fld("LD.duty","ld_duty")+fld("LD.clear","ld_clear")+fld("LD.local","ld_local")+'</div>'+
 '<div class="card"><h3>'+T("ld_total")+'</h3><div class="big">'+da(l.total)+'</div><p class="note">'+T("ld_ratio",nf(ratio*100))+'</p><div class="legend" style="grid-template-columns:minmax(0,1fr) auto">'+rows.map(function(r){return'<span>'+T(r[0])+'</span><span class="val">'+da(r[1])+'</span>'}).join("")+'</div>'+
 '<p><button class="btn" id="useLanded">'+T("ld_use")+'</button></p><p class="note">'+T("ld_n")+'</p></div></div>'}
function vScen(){var p=P(),rows=["pess","base","opt"].map(function(n){var q=n==="base"?p:scenario(p,n),m=model(q),vv=verdict(q,m).v;return{n:n,q:q,m:m,v:vv}});
 return'<div class="card"><h3>'+T("sc_t")+'</h3><div class="tw"><table><thead><tr><th></th><th class="val">'+T("sc_cr")+'</th><th class="val">'+T("sc_dr")+'</th><th class="val">'+T("sc_cpo")+'</th><th class="val">'+T("k_net")+'</th><th class="val">'+T("th_unit")+'</th><th class="val">ROI</th><th>'+T("th_v")+'</th></tr></thead><tbody>'+
 rows.map(function(r){return'<tr><td><b>'+T("sc_"+r.n)+'</b></td><td class="val">'+pc(r.q.cr)+'</td><td class="val">'+pc(r.q.dr)+'</td><td class="val">$'+nf(r.q.cpo,2)+'</td><td class="val">'+da(r.m.net)+'</td><td class="val">'+da(r.m.perOrder)+'</td><td class="val">'+pc(r.m.roi)+'</td><td><span class="dot '+r.v+'"></span>'+T(r.v)+'</td></tr>'}).join("")+'</tbody></table></div><p class="note">'+T("sc_d")+'</p></div>'}
function vSens(){var p=P(),drs=[0.4,0.5,0.6,0.7,0.8,0.9],fs=[0.5,0.75,1,1.25,1.5,2],ci=0,cj=0,bd=9;
 drs.forEach(function(d,i){if(Math.abs(d-p.dr)<bd){bd=Math.abs(d-p.dr);ci=i}});
 var h='<div class="card"><h3>'+T("se_t")+'</h3><div class="tw"><table class="heat"><thead><tr><th>'+T("se_dr")+'</th>'+fs.map(function(f){return'<th>$'+nf(p.cpo*f,2)+'</th>'}).join("")+'</tr></thead><tbody>';
 var vals=[];drs.forEach(function(d){fs.forEach(function(f){var q=Object.assign({},p,{dr:d,cpo:p.cpo*f});vals.push(model(q).perOrder)})});
 var mx=Math.max.apply(null,vals.map(Math.abs))||1;
 drs.forEach(function(d,i){h+='<tr><th>'+pc(d)+'</th>';fs.forEach(function(f,j){var v=vals[i*fs.length+j],a=Math.min(60,Math.abs(v)/mx*60+6);
  h+='<td class="'+(i===ci&&f===1?"cur":"")+'" style="background:color-mix(in srgb,var('+(v>=0?"--good":"--bad")+') '+a.toFixed(0)+'%,var(--surface))">'+nf(v)+'</td>'});h+='</tr>'});
 return h+'</tbody></table></div><p class="note">'+T("se_d")+'</p></div>'}
function vBund(){var p=P(),tiers=[[1,p.price],[2,+S.b2],[3,+S.b3]];
 var rs=tiers.map(function(t){var q=Object.assign({},p,{units:t[0],price:t[1]}),m=model(q);return{u:t[0],pr:t[1],m:m,per100:m.netPerLead*100}});
 var best=0;rs.forEach(function(r,i){if(r.per100>rs[best].per100)best=i});
 return'<div class="card"><h3>'+T("bu_t")+'</h3><div class="tw"><table><thead><tr><th>'+T("bu_pieces")+'</th><th class="val">'+T("bu_price")+'</th><th class="val">'+T("bu_perorder")+'</th><th class="val">'+T("bu_per100")+'</th><th></th></tr></thead><tbody>'+
 rs.map(function(r,i){return'<tr class="'+(i===best?"best":"")+'"><td><b>'+r.u+'</b></td><td class="val">'+(i===0?da(r.pr):'<input id="xS'+("b"+(i+1))+'" data-k="S.b'+(i+1)+'" type="number" inputmode="decimal" min="0" value="'+r.pr+'" style="width:110px">')+'</td><td class="val">'+da(r.m.perOrder)+'</td><td class="val">'+da(r.per100)+'</td><td>'+(i===best?T("bu_best"):"")+'</td></tr>'}).join("")+
 '</tbody></table></div><p class="note">'+T("bu_d")+'</p></div>'}
function vTest(){var p=P(),m=model(p),B=+S.budget,tb=+S.tbudget||0,leads=tb/p.cpo,conf=leads*p.cr,del=conf*p.dr,net=leads*m.netPerLead,ten=10/(p.cr*p.dr)*p.cpo;
 return'<div class="card"><h3>'+T("te_t")+'</h3><div style="max-width:420px">'+fld("S.tbudget","te_budget")+'</div>'+
 '<div class="be"><div><div class="l">'+T("te_leads")+'</div><div class="v">'+nf(leads,1)+'</div></div><div><div class="l">'+T("te_conf")+'</div><div class="v">'+nf(conf,1)+'</div></div><div><div class="l">'+T("te_del")+'</div><div class="v">'+nf(del,1)+'</div></div><div><div class="l">'+T("te_net")+'</div><div class="v" style="color:var('+(net>=0?"--good":"--bad")+')">'+da(net)+'</div></div><div><div class="l">'+T("te_ten")+'</div><div class="v">$'+nf(ten,0)+'</div></div></div>'+
 '<p style="margin:16px 0 0"><b>'+T("te_kill","$"+nf(Math.max(0,m.maxCpo),2))+'</b></p><p class="note">'+T("te_kill2")+'</p></div>'}
function summary(){var p=P(),m=model(p),vd=verdict(p,m),be=solveRate(p,"dr");
 return[S.name+" - "+vd.v,"Price "+nf(p.price)+" DZD | cost "+nf(p.cost+p.pack)+" DZD | CPO $"+p.cpo+" | conf "+pc(p.cr)+" | delivery "+pc(p.dr),
 "Net "+nf(m.net)+" DZD on "+m.D+" delivered | per order "+nf(m.perOrder)+" | ROI "+pc(m.roi)+" | margin "+pc(m.margin),"Max CPO $"+nf(m.maxCpo,2)+" | break-even ROAS "+nf(m.beRoas,2)+"x | min delivery rate "+(be===null?"n/a":pc(be))].join("\n")}
function vSave(){var rows=saved.map(function(s,i){var p=P(s.S),m=model(p),vv=verdict(p,m).v;return'<tr><td><b>'+esc(s.S.name)+'</b></td><td class="val">'+nf(p.price)+'</td><td class="val">'+da(m.perOrder)+'</td><td class="val">'+pc(m.roi)+'</td><td><span class="dot '+vv+'"></span>'+T(vv)+'</td><td><button class="btn sm sec" data-load="'+i+'">'+T("sv_load")+'</button> <button class="btn sm sec" data-del="'+i+'">'+T("sv_del")+'</button></td></tr>'}).join("");
 return'<div class="card"><h3>'+T("sv_t")+'</h3><div class="row" style="margin-bottom:12px"><button class="btn" id="svNow">'+T("sv_save")+'</button><button class="btn sec" id="svCsv">'+T("sv_csv")+'</button><button class="btn sec" id="svSum">'+T("sv_sum")+'</button><button class="btn sec" id="svJson">'+T("sv_json")+'</button></div>'+
 (saved.length?'<div class="tw"><table><thead><tr><th>'+T("th_name")+'</th><th class="val">'+T("th_price")+'</th><th class="val">'+T("th_unit")+'</th><th class="val">'+T("th_roi")+'</th><th>'+T("th_v")+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="note">'+T("sv_empty")+'</p>')+'</div>'+
 '<div class="card"><h3>'+T("sv_imp")+'</h3><textarea id="impText" dir="ltr" placeholder="'+T("sv_paste")+'"></textarea><p><button class="btn" id="impBtn">'+T("sv_imp")+'</button></p></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){applyI18n();var h={over:vOver,land:vLand,fun:vFun,zone:vZone,price:vPrice,bund:vBund,scen:vScen,sens:vSens,risk:vRisk,cash:vCash,month:vMonth,test:vTest,save:vSave}[tab]();$("view").innerHTML=h;bind();}
function bind(){bindFields();var x;
 x=$("useCpo");if(x)x.onclick=function(){var f=adFunnel({cpm:+S.cpm||0.01,ctr:+S.ctr||0.01,cvr:+S.cvr||0.01},1);setInput("cpo",Math.round(f.cpo*100)/100);persist();tab="over";render()};
 x=$("applyZone");if(x)x.onclick=function(){var c=zoneCalc(P(),[[+S.z1s,+S.z1d,+S.z1r],[+S.z2s,+S.z2d,+S.z2r],[+S.z3s,+S.z3d,+S.z3r]]);setInput("dr",Math.round(c.dr*1000)/10);setInput("ret",Math.round(c.ret));persist();tab="over";render()};
 var u=$("useLanded");if(u)u.onclick=function(){setInput("cost",Math.round(landed(LD,+S.rate).total));persist();tab="over";render();};
 var sn=$("svNow");if(sn){sn.onclick=function(){saved.unshift({S:Object.assign({},S),LD:Object.assign({},LD)});saved=saved.slice(0,30);persist();render();toast(T("sv_saved"))};
  $("svCsv").onclick=function(){var head="name,price,cost,packaging,conf_pct,delivery_pct,cpo_usd,profit_per_order,roi_pct,verdict";copy([head].concat(saved.map(function(s){var p=P(s.S),m=model(p);return[JSON.stringify(s.S.name),p.price,p.cost,p.pack,s.S.cr,s.S.dr,p.cpo,Math.round(m.perOrder),Math.round(m.roi*100),verdict(p,m).v].join(",")})).join("\n"))};
  $("svSum").onclick=function(){copy(summary())};
  $("svJson").onclick=function(){copy(JSON.stringify({S:S,LD:LD}))};
  $("impBtn").onclick=function(){try{var j=JSON.parse($("impText").value);var s=j.S||j;Object.keys(DEF).forEach(function(k){if(k in s&&!isNaN(+s[k])||k==="name"&&s.name)S[k]=k==="name"?String(s.name):+s[k]});if(j.LD)Object.keys(LDEF).forEach(function(k){if(k in j.LD)LD[k]=+j.LD[k]});persist();Object.keys(S).forEach(function(k){var e=$("in_"+k);if(e)e.value=S[k]});tab="over";render()}catch(e){toast(T("sv_bad"))}};
  document.querySelectorAll("[data-load]").forEach(function(b){b.onclick=function(){var s=saved[+b.dataset.load];Object.assign(S,s.S);Object.assign(LD,s.LD||{});persist();Object.keys(S).forEach(function(k){var e=$("in_"+k);if(e)e.value=S[k]});tab="over";render()}});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){saved.splice(+b.dataset.del,1);persist();render()}});}}
function bindFields(){document.querySelectorAll("#view input[data-k]").forEach(function(el){el.oninput=function(){var a=el.dataset.k.split("."),id=el.id;(a[0]==="S"?S:LD)[a[1]]=el.value===""?0:+el.value;persist();render();var n=$(id);if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(e){}}}})}

$("btnPrint").onclick=function(){try{window.print()}catch(e){}};
init();
